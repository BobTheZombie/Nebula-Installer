[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-installer"
version = "0.1.0"
description = "Nebula Installer for LuminOS backed by LPM"
readme = "README.md"
authors = [{name = "Nebula OS"}]
requires-python = ">=3.9"
keywords = ["nebula", "installer", "lpm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "textual>=0.47.1",
]

[project.scripts]
nebula-installer = "nebula_installer.__main__:main"

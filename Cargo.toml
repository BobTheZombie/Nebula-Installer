[package]
name = "nebula-installer"
version = "0.1.0"
edition = "2021"

[dependencies]
iced = { version = "0.12", features = ["tokio", "lazy", "canvas"] }
cosmic = { git = "https://github.com/pop-os/libcosmic" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
